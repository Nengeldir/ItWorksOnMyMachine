services:
  backend:
    # Both images build from the repo root so they can copy shared/ (the catalog)
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data # leaderboards, ghosts and adventure profiles, kept in the volume below
      TRUST_USER_HEADERS: "1" # logins come from the VIScon portal's headers; never expose port 8080 without it
    volumes:
      - game-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 8080:8080 # The VIScon portal forwards your team's address to this port
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  game-data:
