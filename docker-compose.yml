services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data # leaderboards, ghosts and adventure profiles, kept in the volume below
    volumes:
      - game-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - 8080:8080 # The VIScon portal forwards your team's address to this port
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  game-data:
